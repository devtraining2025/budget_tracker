name: Test with uv

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

jobs:

  build-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t budget_tracker:latest .

      - name: Docker run container from previous job
        run: |
          docker run -d -p 8001:9000 --name budget_tracker_test budget_tracker:latest

      - name: UV tool setup in docker container
        run: |
          docker exec -it budget_tracker_test sh -c "pip install uv"
          docker exec -it budget_tracker_test sh -c "uv sync --group dev"

      - name: Run Ruff
        run: docker exec -it budget_tracker_test sh -c "uv run ruff check ."  
      - name: Run Tests
        run: docker exec -it budget_tracker_test sh -c "uv run pytest"

      - name: Run black formtter check
        run: docker exec -it budget_tracker_test sh -c "uv run black --check ."

      - name: Log in to Docker Hub
        uses: docker/login-action@v2

        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push Docker Image
        run: docker push budget_tracker:latest
  



