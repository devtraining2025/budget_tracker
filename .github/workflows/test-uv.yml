name: Test with uv

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

jobs:
  test-uv-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with: 
          python-version: '3.10'

      - name: Install dependencies
        run: |
          uv sync
          uv sync --group dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest


